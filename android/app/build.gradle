plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Read key.properties ───────────────────────────────────────────────────────
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader -> keyProperties.load(reader) }
}

android {
    namespace "com.gravitystickman.stickman_physics"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.gravitystickman.stickman_physics"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode 15       // increment this by 1 every time you upload
        versionName "1.0.15" // your app version shown in Play Store
    }

    signingConfigs {
        release {
            keyAlias      keyProperties['keyAlias']
            keyPassword   keyProperties['keyPassword']
            storeFile     keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword keyProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
