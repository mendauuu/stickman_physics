name: stickman_physics
description: Class Clash - a Millat Umidi student fights teachers from the basement to the top floor.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  vibration: ^3.1.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.3


  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: false 
  image_path: "assets/icon/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/Knight/
    - assets/Enchantress/
    - assets/Swordsman/
    - assets/FreeKnight_v1/Colour1/NoOutline/120x80_PNGSheets/
    - assets/FreeKnight_v1/Colour2/NoOutline/120x80_PNGSheets/
    - assets/Martial Hero/Sprites/
    - assets/Monsters_Creatures_Fantasy/Goblin/
    - assets/Monsters_Creatures_Fantasy/Mushroom/
    - assets/Monsters_Creatures_Fantasy/Skeleton/
    - assets/Monsters_Creatures_Fantasy/Flying eye/
    # /splash_animation.json
    # - assets/welcome_animation.json
  #   - images/a_dot_ham.jpeg

